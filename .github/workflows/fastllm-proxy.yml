name: fastllm-proxy

# Build fastllm-proxy from upstream main (azrtydxb/Fastllm-proxy) and publish
# to ghcr.io/0xf01d/containers/fastllm-proxy:main-<sha>.
#
# Why: upstream GHCR only ships tagged releases (latest == v0.3.4). The Claude
# Code native-passthrough fixes (issues #37/#38) are on main but not released.
# This image surfaces main so our cluster can pull the fixed gateway.

on:
  workflow_dispatch: {}
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/0xf01d/containers/fastllm-proxy

jobs:
  build:
    # arm64 native runner: Dockerfile (and the kw cluster) is arm64 throughout,
    # and QEMU-emulating a Rust LTO release build is far slower than it's worth.
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout upstream main
        uses: actions/checkout@v4
        with:
          repository: azrtydxb/Fastllm-proxy
          ref: main

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tag
        id: tag
        run: |
          SHA=$(git rev-parse --short HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tag=main-$SHA" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max